<!doctype html>
<!--
  O idioma declarado no elemento raiz é o que faz o leitor de tela escolher a
  pronúncia. Com lang="en", "dúvida" e "matriculados" saem lidos com fonética
  inglesa, e a interface fica incompreensível para quem depende de áudio.
  Era o valor padrão do gerador do projeto e nunca foi corrigido.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      O ícone da aba era o raio roxo que acompanha o gerador do projeto, e
      ficava ao lado do nome "Plataforma UNIFEI" em toda aba aberta. Agora é o
      símbolo institucional, derivado do mesmo arquivo usado na barra lateral.

      Dois tamanhos porque servem a lugares diferentes: 32 pixels é o que o
      navegador mostra na aba, 180 é o que o telefone usa quando a pessoa
      adiciona a plataforma à tela inicial.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="theme-color" content="#003364" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fórum acadêmico por disciplina e voluntariado universitário da Universidade Federal de Itajubá." />
    <title>Plataforma UNIFEI — Fórum acadêmico e voluntariado</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
