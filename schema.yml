  /api/forum/alertas/:
    get:
      operationId: forum_alertas_list
      description: |-
        Fila de moderacao de conteudo.

        A moderacao e descentralizada: cada monitor ou professor cuida das
        denuncias das disciplinas em que atua, porque e quem tem contexto para
        julgar se o conteudo e mesmo impróprio. O administrador enxerga tudo.

        Fluxo: pendente -> em_analise -> procedente ou improcedente.

        - GET  /alertas/                 lista a fila (filtros: status, disciplina)
        - POST /alertas/{id}/assumir/    marca que o moderador esta cuidando do caso
        - POST /alertas/{id}/liberar/    devolve o caso para a fila
        - POST /alertas/{id}/resolver/   decide e encerra
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      tags:
      - forum
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertaConteudoList'
          description: ''
