openapi: 3.0.3
info:
  title: Plataforma UNIFEI - API
  version: 1.0.0
  description: API REST da plataforma que integra forum academico organizado por disciplina
    com sistema de voluntariado universitario. Trabalho de Conclusao de Curso - Ciencia
    da Computacao - UNIFEI.
paths:
  /api/auditoria/:
    get:
      operationId: auditoria_list
      description: |-
        Listagem de registros de auditoria (somente leitura).

        Regras de acesso:
        - Admin/superuser: ve todos os registros
        - Usuario comum: ve apenas registros que envolvem ele
          (acoes que ele executou OU sobre objetos que ele e dono/autor)

        Filtros disponiveis via query params:
        - ?acao=login -- filtra por tipo de acao
        - ?usuario={id} -- filtra por usuario (so admin)
        - ?data_inicio=2026-05-01 -- filtra por data
        - ?data_fim=2026-05-31
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      tags:
      - auditoria
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/auditoria/{id}/:
    get:
      operationId: auditoria_retrieve
      description: |-
        Listagem de registros de auditoria (somente leitura).

        Regras de acesso:
        - Admin/superuser: ve todos os registros
        - Usuario comum: ve apenas registros que envolvem ele
          (acoes que ele executou OU sobre objetos que ele e dono/autor)

        Filtros disponiveis via query params:
        - ?acao=login -- filtra por tipo de acao
        - ?usuario={id} -- filtra por usuario (so admin)
        - ?data_inicio=2026-05-01 -- filtra por data
        - ?data_fim=2026-05-31
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este Registro de Auditoria.
        required: true
      tags:
      - auditoria
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/auth/ativar/:
    post:
      operationId: auth_ativar_create
      description: |-
        POST /api/auth/ativar/

        Valida o codigo OTP e ativa a conta do usuario. Em caso de sucesso,
        retorna os tokens JWT (access e refresh) prontos para uso.
      summary: Ativar conta de usuario
      tags:
      - Autenticacao
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtivacaoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AtivacaoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AtivacaoRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/estatisticas/:
    get:
      operationId: auth_estatisticas_retrieve
      description: Contagens agregadas para a tela de entrada.
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        POST /api/auth/logout/

        Encerra a sessao invalidando o refresh token informado.

        Nao ha como revogar um token de acesso ja emitido, porque ele e validado
        apenas pela assinatura. O que o logout garante e que nenhum acesso novo
        sera emitido a partir daquela sessao, e o acesso em circulacao expira em
        ate uma hora.
      summary: Encerrar sessao
      tags:
      - Autenticacao
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '205':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: |-
        GET   /api/auth/me/   dados do usuario autenticado
        PATCH /api/auth/me/   altera os campos que a propria pessoa controla

        Dados do usuario autenticado, incluindo os papeis que ele exerce.

        Os papeis vao juntos de proposito. A interface precisa saber, logo no
        carregamento, se deve exibir a area de moderacao ou as acoes de
        coordenacao, e buscar isso em uma chamada separada por tela produziria
        um piscar de itens aparecendo e sumindo. A permissao continua sendo
        verificada no backend a cada requisicao; isto aqui e apresentacao.
      summary: Dados do usuario autenticado
      tags:
      - Autenticacao
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: |-
        GET   /api/auth/me/   dados do usuario autenticado
        PATCH /api/auth/me/   altera os campos que a propria pessoa controla

        Dados do usuario autenticado, incluindo os papeis que ele exerce.

        Os papeis vao juntos de proposito. A interface precisa saber, logo no
        carregamento, se deve exibir a area de moderacao ou as acoes de
        coordenacao, e buscar isso em uma chamada separada por tela produziria
        um piscar de itens aparecendo e sumindo. A permissao continua sendo
        verificada no backend a cada requisicao; isto aqui e apresentacao.
      summary: Atualiza os dados editaveis do proprio perfil
      tags:
      - Autenticacao
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/pre-cadastro/:
    post:
      operationId: auth_pre_cadastro_create
      description: |-
        POST /api/auth/pre-cadastro/

        Cadastro institucional feito pela coordenacao.

        Se o CPF ja existir, a pessoa nao e recriada: apenas atualizamos matricula
        e nome, e seguimos para o vinculo. E o caso comum do monitor, que ja e
        aluno da plataforma.
      summary: Pre-cadastrar pessoa e vincular a disciplina
      tags:
      - Autenticacao
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreCadastroRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PreCadastroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PreCadastroRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/reenviar-codigo/:
    post:
      operationId: auth_reenviar_codigo_create
      description: |-
        POST /api/auth/reenviar-codigo/

        Gera um novo codigo de ativacao para usuario ainda inativo.
        Para evitar enumeration attacks (descobrir quais emails estao cadastrados),
        sempre retorna sucesso, mesmo se o email nao existir.
      summary: Reenviar codigo de ativacao
      tags:
      - Autenticacao
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReenvioCodigoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReenvioCodigoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReenvioCodigoRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        POST /api/auth/refresh/

        Renova o token de acesso e invalida o refresh apresentado, que passa a
        constar na lista mantida no Redis.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshComListaRedisRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshComListaRedisRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshComListaRedisRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshComListaRedis'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        POST /api/auth/register/

        Cria um novo usuario com status inativo e dispara o email de ativacao.
        Nao retorna tokens; usuario precisa ativar a conta antes de logar.
      summary: Registrar novo usuario
      tags:
      - Autenticacao
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/usuarios/:
    get:
      operationId: auth_usuarios_list
      description: |-
        GET /api/auth/usuarios/?busca=texto

        Consulta de pessoas para as telas de atribuicao da coordenacao.

        Exige ao menos tres caracteres e devolve poucos resultados de proposito:
        e um campo de busca para encontrar alguem conhecido, nao uma listagem
        navegavel de toda a base de usuarios.
      summary: Buscar pessoas para atribuicao
      tags:
      - Autenticacao
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioResumo'
          description: ''
  /api/auth/verify/:
    post:
      operationId: auth_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/busca/:
    get:
      operationId: busca_list
      description: |-
        Procura publicacoes no forum das disciplinas de quem consulta.

        GET /api/busca/?q=texto&disciplina=<uuid>&limite=20

        A resposta traz o modo que respondeu:

            semantica  comparacao por significado, com relevancia por resultado
            textual    correspondencia dos termos digitados
            vazia      nenhum termo informado
      parameters:
      - in: query
        name: disciplina
        schema:
          type: string
        description: Restringe a uma disciplina
      - in: query
        name: limite
        schema:
          type: integer
        description: Maximo de resultados (ate 50)
      - in: query
        name: q
        schema:
          type: string
        description: Texto procurado
      tags:
      - busca
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResultadoBusca'
          description: ''
  /api/colaboracao/ajuda/:
    get:
      operationId: colaboracao_ajuda_list
      description: |-
        Pedidos de ajuda vindos das conversas de grupo.

        Quem ensina ve os pedidos das suas disciplinas; quem pediu ve os proprios.
        O conteudo do chat em volta continua invisivel para todos.
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      tags:
      - colaboracao
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSolicitacaoAjudaList'
          description: ''
  /api/colaboracao/ajuda/{id}/:
    get:
      operationId: colaboracao_ajuda_retrieve
      description: |-
        Pedidos de ajuda vindos das conversas de grupo.

        Quem ensina ve os pedidos das suas disciplinas; quem pediu ve os proprios.
        O conteudo do chat em volta continua invisivel para todos.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este Solicitacao de Ajuda.
        required: true
      tags:
      - colaboracao
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoAjuda'
          description: ''
  /api/colaboracao/ajuda/{id}/assumir/:
    post:
      operationId: colaboracao_ajuda_assumir_create
      description: Sinaliza que alguem esta atendendo, evitando resposta duplicada.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este Solicitacao de Ajuda.
        required: true
      tags:
      - colaboracao
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitacaoAjudaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SolicitacaoAjudaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SolicitacaoAjudaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoAjuda'
          description: ''
  /api/colaboracao/ajuda/{id}/responder/:
    post:
      operationId: colaboracao_ajuda_responder_create
      description: |-
        Pedidos de ajuda vindos das conversas de grupo.

        Quem ensina ve os pedidos das suas disciplinas; quem pediu ve os proprios.
        O conteudo do chat em volta continua invisivel para todos.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este Solicitacao de Ajuda.
        required: true
      tags:
      - colaboracao
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitacaoAjudaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SolicitacaoAjudaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SolicitacaoAjudaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitacaoAjuda'
          description: ''
  /api/colaboracao/conversas/:
    get:
      operationId: colaboracao_conversas_list
      description: |-
        Conversas de que a pessoa participa.

        Nao ha criacao por aqui: a conversa de grupo nasce com o grupo, e a de
        turma com a disciplina. Criar avulso produziria conversa sem dono.
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      tags:
      - colaboracao
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConversaList'
          description: ''
  /api/colaboracao/conversas/{id}/:
    get:
      operationId: colaboracao_conversas_retrieve
      description: |-
        Conversas de que a pessoa participa.

        Nao ha criacao por aqui: a conversa de grupo nasce com o grupo, e a de
        turma com a disciplina. Criar avulso produziria conversa sem dono.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este Conversa.
        required: true
      tags:
      - colaboracao
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversa'
          description: ''
  /api/colaboracao/conversas/{id}/marcar-lida/:
    post:
      operationId: colaboracao_conversas_marcar_lida_create
      description: |-
        Conversas de que a pessoa participa.

        Nao ha criacao por aqui: a conversa de grupo nasce com o grupo, e a de
        turma com a disciplina. Criar avulso produziria conversa sem dono.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este Conversa.
        required: true
      tags:
      - colaboracao
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversa'
          description: ''
  /api/colaboracao/conversas/{id}/mensagens/:
    get:
      operationId: colaboracao_conversas_mensagens_retrieve
      description: |-
        GET lista as mensagens; POST envia uma nova, com anexo opcional.

        O envio tambem acontece pelo WebSocket. Este caminho existe para o
        anexo, que nao trafega bem por socket, e como alternativa quando a
        conexao em tempo real cai.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este Conversa.
        required: true
      tags:
      - colaboracao
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversa'
          description: ''
    post:
      operationId: colaboracao_conversas_mensagens_create
      description: |-
        GET lista as mensagens; POST envia uma nova, com anexo opcional.

        O envio tambem acontece pelo WebSocket. Este caminho existe para o
        anexo, que nao trafega bem por socket, e como alternativa quando a
        conexao em tempo real cai.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este Conversa.
        required: true
      tags:
      - colaboracao
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversa'
          description: ''
  /api/colaboracao/grupos/:
    get:
      operationId: colaboracao_grupos_list
      description: Grupos de um trabalho, com entrada e saida dos participantes.
      parameters:
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      tags:
      - colaboracao
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGrupoTrabalhoList'
          description: ''
    post:
      operationId: colaboracao_grupos_create
      description: Grupos de um trabalho, com entrada e saida dos participantes.
      tags:
      - colaboracao
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrupoTrabalhoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GrupoTrabalhoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GrupoTrabalhoRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrupoTrabalho'
          description: ''
  /api/colaboracao/grupos/{id}/:
    get:
      operationId: colaboracao_grupos_retrieve
      description: Grupos de um trabalho, com entrada e saida dos participantes.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este Grupo de Trabalho.
        required: true
      tags:
      - colaboracao
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrupoTrabalho'
          description: ''
    put:
      operationId: colaboracao_grupos_update
      description: Grupos de um trabalho, com entrada e saida dos participantes.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: Um string UUID que identifica este Grupo de Trabalho.
        required: true
      tags:
      - colaboracao
      requestBody:
        content:
