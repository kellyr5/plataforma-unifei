  /api/notificacoes/:
    get:
      operationId: notificacoes_list
      description: |-
        Notificacoes do usuario autenticado.

        A notificacao pertence a quem a recebeu, entao ele pode descarta-la. Nao
        ha soft delete aqui: o aviso e efemero por natureza, e o que precisa ficar
        registrado para prestacao de contas ja esta no log de auditoria.

        Acoes:
        - GET    /notificacoes/                        lista (filtros ?lida= e ?tipo=)
        - GET    /notificacoes/{id}/                   detalha
        - DELETE /notificacoes/{id}/                   exclui uma
        - GET    /notificacoes/nao-lidas/              contador rapido
        - POST   /notificacoes/{id}/marcar-lida/       marca uma como lida
        - POST   /notificacoes/marcar-todas-lidas/     marca todas como lidas
        - POST   /notificacoes/limpar/                 exclui varias de uma vez
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      tags:
      - notificacoes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificacaoList'
          description: ''
