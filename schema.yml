    PreCadastroRequest:
      type: object
      description: |-
        Pre-cadastro feito pela coordenacao, no modelo do SIGAA.

        A conta nasce inativa e sem senha utilizavel. Quem verificou o vinculo
        institucional foi a coordenacao, mas a pessoa ainda precisa provar que
        controla o email informado, e isso acontece no primeiro acesso, pelo mesmo
        fluxo de ativacao por codigo que os demais usuarios ja usam. Assim nao
        existe senha provisoria circulando por terceiros.
      properties:
        nome_completo:
          type: string
          minLength: 1
          maxLength: 255
        cpf:
          type: string
          minLength: 1
          maxLength: 14
        email:
          type: string
          format: email
          minLength: 1
        matricula:
          type: string
          maxLength: 20
        disciplina:
          type: string
          format: uuid
          nullable: true
        papel:
          $ref: '#/components/schemas/PreCadastroPapelEnum'
      required:
      - cpf
      - email
      - nome_completo
    ReenvioCodigoRequest:
      type: object
      description: Serializer para reenvio de codigo de ativacao.
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    RefreshComListaRedis:
      type: object
      description: |-
        Renovacao de acesso com invalidacao do refresh token no Redis.

        O SimpleJWT rotaciona o token, ou seja, devolve um refresh novo a cada
        renovacao. Sem invalidar o antigo, ele continuaria valido ate expirar, e
        quem o tivesse interceptado poderia usa-lo em paralelo. Aqui o token
        apresentado e recusado se ja constar na lista, e passa a constar assim que
        a rotacao acontece.
      properties:
        refresh:
          type: string
        access:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    RefreshComListaRedisRequest:
      type: object
      description: |-
        Renovacao de acesso com invalidacao do refresh token no Redis.

        O SimpleJWT rotaciona o token, ou seja, devolve um refresh novo a cada
        renovacao. Sem invalidar o antigo, ele continuaria valido ate expirar, e
        quem o tivesse interceptado poderia usa-lo em paralelo. Aqui o token
        apresentado e recusado se ja constar na lista, e passa a constar assim que
        a rotacao acontece.
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
