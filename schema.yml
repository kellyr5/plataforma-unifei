    NotificacaoTipoEnum:
      enum:
      - nova_resposta
      - voto_recebido
      - melhor_resposta
      - reacao_persiste
      - denuncia_resolvida
      - post_removido
      - post_restrito
      - post_liberado
      - papel_disciplina
      - ajuda_solicitada
      - ajuda_respondida
      - grupo_formado
      - mensagem_grupo
      - inscricao_aprovada
      - inscricao_rejeitada
      - inscricao_removida
      - voluntariado_concluido
      type: string
      description: |-
        * `nova_resposta` - Nova resposta no seu topico
        * `voto_recebido` - Novo voto no seu post
        * `melhor_resposta` - Sua resposta foi marcada como melhor
        * `reacao_persiste` - Reacao "duvida persiste" na sua resposta
        * `denuncia_resolvida` - Sua denuncia foi resolvida
        * `post_removido` - Seu post foi removido por moderacao
        * `post_restrito` - Sua publicacao foi restrita pela disciplina
        * `post_liberado` - A restricao da sua publicacao foi removida
        * `papel_disciplina` - Voce foi adicionado a uma disciplina
        * `ajuda_solicitada` - Pedido de ajuda em um grupo de trabalho
        * `ajuda_respondida` - Seu pedido de ajuda foi respondido
        * `grupo_formado` - Voce foi incluido em um grupo de trabalho
        * `mensagem_grupo` - Nova mensagem no seu grupo
        * `inscricao_aprovada` - Sua inscricao em voluntariado foi aprovada
        * `inscricao_rejeitada` - Sua inscricao em voluntariado foi rejeitada
        * `inscricao_removida` - Voce foi removido de uma oportunidade
        * `voluntariado_concluido` - Sua participacao foi concluida e o certificado emitido
    Oportunidade:
      type: object
      description: Serializa oportunidades de voluntariado.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organizacao:
          type: string
          format: uuid
          readOnly: true
          description: Usuario com RoleGlobal=ong ou admin que publicou a oportunidade
        organizacao_nome:
          type: string
          readOnly: true
        organizacao_foto_url:
          type: string
          nullable: true
          description: |-
            Logotipo de quem publica a oportunidade.

            A foto enviada tem preferencia sobre o endereco externo: quem subiu a
            imagem pela plataforma fez isso depois, e a intencao mais recente
            prevalece. Sem nenhuma das duas, a tela desenha as iniciais do nome.
          readOnly: true
        titulo:
          type: string
          maxLength: 255
        descricao:
          type: string
        o_que_fazer:
          type: string
          description: Atividades que o voluntario ira desempenhar
        requisitos:
          type: string
          description: O que se espera de quem se inscrever
        imagem:
          type: string
          format: uri
          nullable: true
          description: Imagem de capa exibida no cartao da oportunidade
        imagem_url:
          type: string
          nullable: true
          readOnly: true
        area:
          $ref: '#/components/schemas/AreaEnum'
        area_display:
          type: string
          readOnly: true
        local:
          type: string
          description: Cidade/local de realizacao
          maxLength: 255
        vagas:
          type: integer
          maximum: 2147483647
          minimum: 0
        vagas_disponiveis:
          type: integer
          readOnly: true
        total_inscritos:
          type: integer
          readOnly: true
        minha_inscricao:
          type: string
          nullable: true
          description: |-
            Situacao da inscricao de quem esta consultando, quando existir.

            E uma inscricao por pessoa em cada oportunidade, garantido por
            constraint no banco. A tela precisa saber disso antes de oferecer o
            botao, para nao convidar alguem a repetir algo que sera recusado.
          readOnly: true
        carga_horaria_total:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Carga horaria estimada em horas
        data_inicio:
          type: string
          format: date
        data_fim:
          type: string
          format: date
        prazo_inscricao:
          type: string
          format: date
        requer_aprovacao:
          type: boolean
          description: Se False, inscricoes sao aprovadas automaticamente
        status:
          $ref: '#/components/schemas/OportunidadeStatusEnum'
        status_display:
          type: string
          readOnly: true
        esta_aberta_inscricao:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - area
      - area_display
      - carga_horaria_total
      - created_at
      - data_fim
      - data_inicio
      - descricao
      - esta_aberta_inscricao
      - id
      - imagem_url
      - local
      - minha_inscricao
      - organizacao
      - organizacao_foto_url
      - organizacao_nome
      - prazo_inscricao
      - status_display
      - titulo
      - total_inscritos
      - updated_at
      - vagas_disponiveis
